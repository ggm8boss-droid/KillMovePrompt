; KillMovePrompt - shows a key prompt on a weakened enemy; press it to play a Kaputt killmove.
; Place in Data\SKSE\Plugins\ next to KillMovePrompt.dll

[Input]
; DirectInput scan code. 0x22 = G, 0x21 = F, 0x13 = R, 0x2F = V, 0x2E = C
; Full list: https://wiki.nexusmods.com/index.php/DirectX_Scancodes_And_How_To_Use_Them
Key = 0x22
; Gamepad: 0x1000 = A, 0x2000 = B, 0x4000 = X, 0x8000 = Y, 0x100 = LB, 0x200 = RB
GamepadKey = 0x1000
; true = hold the key instead of tapping it
HoldToExecute = false
HoldDuration = 0.6
PromptText = Execute
; Text color, AABBGGRR. 0xFF5555FF = red, 0xFFFFFFFF = white
PromptColor = 0xFF5555FF

[Target]
; How close the enemy must be, in game units (~70 units per meter)
MaxDistance = 250
; How far off to the side the enemy may be, in degrees (90 = anything in front of you)
MaxFacingAngle = 70
; Max vertical difference between you and the enemy (stairs/slopes). 0 = no limit
MaxHeightDiff = 80
; Use the actor under the crosshair first; otherwise pick the closest valid enemy in front
PreferCrosshair = true
RequireWeaponDrawn = true
RequireHostile = true
ExcludeEssential = true
ExcludeFollowers = true

[Conditions]
; The prompt appears when ANY enabled condition is true
; true = prompt on every valid enemy regardless of health/stagger
AlwaysShow = false
; Show when enemy health is at or below this fraction (0.25 = 25%). 0 disables
HealthThreshold = 0.25
AllowStaggered = true
AllowBleedout = true

[Kaputt]
; Hide the prompt on enemies Kaputt has no valid animation for
UseKaputtPrecondition = true
; Tags (from your Kaputt json files) an animation must have / must not have. Comma separated.
; Example: RequiredTags = front      BannedTags = sneak, decap
RequiredTags =
BannedTags = sneak

[General]
; Seconds between target scans
ScanInterval = 0.1
; Seconds after a killmove before the prompt can show again
Cooldown = 1.5
; Send ModEvent "KillMovePrompt_Execute" (sender = target actor) so Papyrus mods can react.
; numArg is 1.0 if Kaputt played an animation, 0.0 otherwise.
SendModEvent = true
