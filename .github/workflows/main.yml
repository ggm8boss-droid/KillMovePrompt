name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release --config Release

      - name: Package
        shell: pwsh
        run: |
          $out = "package/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/release/KillMovePrompt.dll $out
          Copy-Item dist/SKSE/Plugins/KillMovePrompt.ini $out

      - uses: actions/upload-artifact@v4
        with:
          name: KillMovePrompt
          path: package
